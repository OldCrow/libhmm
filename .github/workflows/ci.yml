name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
  # Weekly canary: catches drift with no code change to trigger it (runner
  # image rolls, toolchain updates) instead of discovering breakage at the
  # next real push.
  schedule:
    - cron: '15 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC / Release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            msvc: false

          # -Werror gated here only (not GCC, to keep one runner as a warnings
          # baseline without -Werror in case a future GCC-only warning needs
          # triage separately). Verified locally clean under AppleClang with
          # the same -Wall -Wextra -Wpedantic -Wpointer-arith set before
          # enabling; Clang/AppleClang share warning implementations closely.
          - name: Linux / Clang / Release
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            msvc: false
            werror: true

          - name: macOS / AppleClang / Release
            os: macos-latest
            cc: clang
            cxx: clang++
            msvc: false

          # Cross-architecture guard: build x86_64 on the Apple Silicon
          # runner and run the suite under Rosetta. CMAKE_SYSTEM_PROCESSOR
          # names the build host here (arm64), so any SIMD selection keyed on
          # it picks NEON sources and -march=armv8-a for an x86_64 target
          # (pylibhmm Actions run 43053531058). pylibhmm's wheel build
          # depends on this configuration working.
          - name: macOS / AppleClang / x86_64 cross (Rosetta)
            os: macos-latest
            cc: clang
            cxx: clang++
            msvc: false
            osx_arch: x86_64

          - name: Windows / MSVC / Release
            os: windows-latest
            msvc: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # -------------------------------------------------------------------------
    # Toolchain setup
    # -------------------------------------------------------------------------
    - name: Activate MSVC toolchain (Windows)
      if: matrix.msvc
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Set compiler environment (Unix)
      if: ${{ !matrix.msvc }}
      run: |
        echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
        echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

    # -------------------------------------------------------------------------
    # Configure
    # GTest is pulled via FetchContent if not found locally (see tests/CMakeLists.txt).
    # LIBHMM_PORTABLE=ON on every CI configure (incl. TSan/ASan jobs below):
    # hosted runners are a hardware/toolchain lottery, and -march=native (or
    # the MSVC CPU probe) bakes in whatever the drawn host advertises — e.g.
    # a host exposing avx10.1-256 turned fatal under Clang's
    # -Winvalid-feature-combination promotion + -Werror (2026-07). Portable
    # baseline keeps CI deterministic; the per-ISA runtime-dispatch TUs keep
    # their targeted flags, so SIMD dispatch is still built and tested.
    # -------------------------------------------------------------------------
    - name: Configure (Windows / MSVC)
      if: matrix.msvc
      shell: pwsh
      run: |
        cmake -B build `
          -G "Ninja" `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DLIBHMM_BUILD_EXAMPLES=OFF `
          -DLIBHMM_BUILD_TOOLS=OFF `
          -DLIBHMM_PORTABLE=ON `
          -DCMAKE_BUILD_TYPE=Release

    - name: Configure (Unix)
      if: ${{ !matrix.msvc }}
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIBHMM_BUILD_EXAMPLES=OFF \
          -DLIBHMM_BUILD_TOOLS=OFF \
          -DLIBHMM_PORTABLE=ON \
          ${{ matrix.osx_arch && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.osx_arch) || '' }} \
          ${{ matrix.werror && '-DLIBHMM_WERROR=ON' || '' }}

    # -------------------------------------------------------------------------
    # Build
    # Bound parallelism to memory, not just CPU. Bare `--parallel` passes `make -j`
    # with no limit, spawning a compile per ready target, which OOM-kills the
    # runner (exit 143, "runner received a shutdown signal", mass `Terminated`).
    # -------------------------------------------------------------------------
    - name: Build all targets
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
          CPU=$(nproc 2>/dev/null || echo 2)
          MEM_JOBS=$(( MEM_GB / 2 ))
          JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
          JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        elif [ "$RUNNER_OS" = "macOS" ]; then
          JOBS=$(sysctl -n hw.logicalcpu 2>/dev/null || echo 3)
        else
          JOBS="${NUMBER_OF_PROCESSORS:-2}"
        fi
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build --config Release --parallel "${JOBS}"

    # A cross leg that silently built for the host would pass every test and
    # guard nothing, so assert the architecture of the library it produced.
    - name: Verify target architecture (cross leg)
      if: matrix.osx_arch
      env:
        WANT_ARCH: ${{ matrix.osx_arch }}
      run: |
        lib=$(find build -name 'libhmm*.dylib' -type f | head -n 1)
        test -n "$lib"
        got=$(lipo -archs "$lib")
        echo "${lib}: ${got}"
        test "$got" = "$WANT_ARCH"

    # -------------------------------------------------------------------------
    # Test — 41/41 tests pass on all platforms
    # -------------------------------------------------------------------------
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure --timeout 60 -LE "known_broken|benchmark"

    # -------------------------------------------------------------------------
    # Install-contract smoke test — Linux/GCC/Release only (cheapest runner;
    # exercises the installed-package path via find_package + pkg-config).
    # -------------------------------------------------------------------------
    - name: Install to prefix
      if: matrix.name == 'Linux / GCC / Release'
      run: cmake --install build --prefix "$GITHUB_WORKSPACE/_install"

    - name: Configure consumer_example against installed prefix
      if: matrix.name == 'Linux / GCC / Release'
      run: |
        cmake -S consumer_example -B consumer_example/build \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install"

    - name: Build and run consumer_example
      if: matrix.name == 'Linux / GCC / Release'
      run: |
        cmake --build consumer_example/build
        ./consumer_example/build/consumer_demo

    - name: pkg-config smoke test
      if: matrix.name == 'Linux / GCC / Release'
      run: |
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/_install/lib/pkgconfig"
        pkg-config --exists --print-errors libhmm
        pkg-config --cflags --libs libhmm

  # ---------------------------------------------------------------------------
  # ThreadSanitizer — catches data races (e.g. concurrent cache fills).
  # Linux/GCC only: TSan on macOS/AppleClang is unreliable with system libraries.
  # -O1 keeps stack frames intact for readable reports; LIBHMM_BUILD_TESTS=ON (the default) required.
  # ---------------------------------------------------------------------------
  tsan:
    name: ThreadSanitizer (Linux / GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure with TSan
      run: |
        cmake -B build-tsan \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DLIBHMM_BUILD_EXAMPLES=OFF \
          -DLIBHMM_BUILD_TOOLS=OFF \
          -DLIBHMM_PORTABLE=ON

    # mem/3 rather than the matrix build's mem/2: TSan instrumentation
    # roughly doubles peak memory per TU.
    - name: Build
      run: |
        MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
        CPU=$(nproc 2>/dev/null || echo 2)
        MEM_JOBS=$(( MEM_GB / 3 ))
        JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
        JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build-tsan --parallel "${JOBS}"

    - name: Test
      run: ctest --test-dir build-tsan -C RelWithDebInfo --output-on-failure --timeout 120 -LE "known_broken|benchmark"

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UndefinedBehaviorSanitizer — catches memory errors and UB.
  # Linux/GCC only: ASan on macOS requires extra setup for system libraries.
  # -O1 -fno-omit-frame-pointer preserves stack frames for readable reports.
  # ---------------------------------------------------------------------------
  asan:
    name: ASan/UBSan (Linux / GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure with ASan/UBSan
      run: |
        cmake -B build-asan \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -g -O1 -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DLIBHMM_BUILD_EXAMPLES=OFF \
          -DLIBHMM_BUILD_TOOLS=OFF \
          -DLIBHMM_PORTABLE=ON

    # mem/3 rather than the matrix build's mem/2: ASan+UBSan instrumentation
    # roughly doubles peak memory per TU.
    - name: Build
      run: |
        MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
        CPU=$(nproc 2>/dev/null || echo 2)
        MEM_JOBS=$(( MEM_GB / 3 ))
        JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
        JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build-asan --parallel "${JOBS}"

    - name: Test
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --test-dir build-asan -C RelWithDebInfo --output-on-failure --timeout 120 -LE "known_broken|benchmark"

  # ---------------------------------------------------------------------------
  # Quality jobs — ubuntu only; run independently of the build matrix.
  # pre-commit mirrors local hook policy. cppcheck remains a dedicated analysis step.
  # ---------------------------------------------------------------------------
  # Runs the same hooks as the local pre-commit hook (CI House Style §6): the
  # local hook is opt-in per clone, so this job is the gate.
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Cache pre-commit environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Install pre-commit
      run: python -m pip install pre-commit==4.7.0

    - name: Run all hooks on all files
      run: pre-commit run --all-files --show-diff-on-failure --color=always

  lint:
    name: Cppcheck (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install cppcheck
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends cppcheck

    - name: cppcheck
      run: |
        cppcheck \
          --enable=warning,style,performance \
          --error-exitcode=1 \
          --suppress=missingIncludeSystem \
          --suppress=useStlAlgorithm \
          --suppress=shadowFunction \
          --suppress=virtualCallInConstructor \
          --suppress=constParameterReference \
          --suppress=noExplicitConstructor \
          --suppress=toomanyconfigs \
          --suppress=functionStatic \
          --std=c++20 \
          -I include \
          src/

  # ---------------------------------------------------------------------------
  # clang-tidy — advisory (non-blocking) for now. See issue #62: the full
  # default check set produces ~3765 warnings dominated by checks that
  # conflict with libhmm's documented architecture (pragma-once convention,
  # intentional SIMD intrinsics/pointer arithmetic in hot paths, the v4
  # template+virtual pattern) — those six checks are disabled in .clang-tidy.
  # Counts from this job need de-duplicating before use: run-clang-tidy
  # re-reports each header diagnostic once per including TU, which is what
  # inflated the old "~1344 residual" figure. Unique file:line:col+check
  # tuples put the real residual at 86 sites (measured 2026-08-16, after #63
  # cleared the modernize-use-nodiscard cluster), all mechanical rather than
  # real defects, so this job reports findings without failing
  # the build. Revisit blocking status now that the cluster is fixed and the
  # job has run noise-free for a few cycles (see PLAN.md).
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy (advisory, ubuntu / Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install clang-tidy
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang-tidy

    - name: Configure (export compile commands)
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DLIBHMM_PORTABLE=ON \
          -DLIBHMM_BUILD_EXAMPLES=OFF \
          -DLIBHMM_BUILD_TOOLS=OFF \
          -DLIBHMM_BUILD_TESTS=OFF

    - name: clang-tidy (advisory — does not fail the job)
      continue-on-error: true
      run: run-clang-tidy -p build -quiet src/

  # Canary failure report (CI House Style section 8). GitHub notifies only
  # whoever last edited the cron line when a scheduled run fails, so this
  # opens an issue instead, or comments on the one already open. It never
  # runs on push or pull_request.
  canary-report:
    name: Canary failure report
    needs: [build, tsan, asan, precommit, lint, clang-tidy]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary failed: ${WORKFLOW}"
          body="The scheduled run of ${WORKFLOW} failed with no push to trigger it: ${RUN_URL}"
          number=$(gh issue list --repo "$REPO" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
