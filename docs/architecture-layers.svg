<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="526" viewBox="0 0 740 526">
  <title>libhmm header layering</title>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Umbrella include -->
    <rect x="12" y="12" width="716" height="52" rx="14"
          fill="#1b4d8f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="370" y="34" font-size="15" font-weight="bold" fill="#ffffff">libhmm.h — single umbrella include</text>
    <text x="370" y="52" font-size="11" fill="#ffffff">headers depend strictly downward &#183; io/, performance/, detail/, common/ sit alongside the numbered stack</text>

    <!-- Layer 4: calculators + training -->
    <rect x="12" y="72" width="476" height="134" rx="14"
          fill="#5b2d8f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="250" y="93" font-size="15" font-weight="bold" fill="#ffffff">Layer 4 — inference &amp; training</text>

    <rect x="24" y="102" width="196" height="92" rx="10"
          fill="#a884e8" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="122" y="121" font-size="12.5" font-weight="bold" fill="#000000">calculators/</text>
    <rect x="34" y="130" width="176" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="122" y="145" font-size="10" font-weight="bold" fill="#000000">ForwardBackwardCalculator</text>
    <rect x="34" y="158" width="176" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="122" y="173" font-size="10" font-weight="bold" fill="#000000">ViterbiCalculator</text>

    <rect x="232" y="102" width="244" height="92" rx="10"
          fill="#cbaef5" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="354" y="121" font-size="12.5" font-weight="bold" fill="#000000">training/</text>
    <rect x="242" y="130" width="224" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="354" y="145" font-size="10" font-weight="bold" fill="#000000">BaumWelch &#183; MapBaumWelch &#183; Viterbi</text>
    <rect x="242" y="158" width="224" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="354" y="173" font-size="10" font-weight="bold" fill="#000000">SegmentalKMeans &#183; model_selection</text>

    <!-- Model: top-level headers, between layers 3 and 4 -->
    <rect x="12" y="214" width="476" height="52" rx="14"
          fill="#2e6fca" stroke="#1a1a1a" stroke-width="3"/>
    <text x="250" y="236" font-size="15" font-weight="bold" fill="#ffffff">Model — basic_hmm.h &#183; hmm.h &#183; topology.h</text>
    <text x="250" y="254" font-size="11" fill="#ffffff">BasicHmm&lt;Obs&gt; &#183; Hmm (scalar, v3-compatible) &#183; HmmMV (multivariate)</text>

    <!-- Layer 3: distributions -->
    <rect x="12" y="274" width="476" height="52" rx="14"
          fill="#0b6e75" stroke="#1a1a1a" stroke-width="3"/>
    <text x="250" y="296" font-size="15" font-weight="bold" fill="#ffffff">Layer 3 — distributions/</text>
    <text x="250" y="314" font-size="11" fill="#ffffff">BasicEmissionDistribution&lt;Obs&gt; &#183; 16 scalar + 3 multivariate</text>

    <!-- Layers 2 to 0: foundations -->
    <rect x="12" y="334" width="476" height="120" rx="14"
          fill="#44546a" stroke="#1a1a1a" stroke-width="3"/>
    <text x="250" y="355" font-size="15" font-weight="bold" fill="#ffffff">Foundations — layers 2 &#8594; 0</text>
    <rect x="24" y="364" width="452" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="250" y="379" font-size="10" font-weight="bold" fill="#000000">2 &#183; linalg/ — BasicMatrix &#183; BasicVector &#183; BasicMatrix3D &#183; Cholesky</text>
    <rect x="24" y="392" width="452" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="250" y="407" font-size="10" font-weight="bold" fill="#000000">1 &#183; math/ — constants &#183; Bessel &#183; digamma/polygamma &#183; log_factorial</text>
    <rect x="24" y="420" width="452" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="250" y="435" font-size="10" font-weight="bold" fill="#000000">0 &#183; platform/ — SIMD CPU detection (compile-time + runtime CPUID)</text>

    <!-- Alongside the stack -->
    <rect x="500" y="72" width="228" height="382" rx="14"
          fill="#d08c00" stroke="#1a1a1a" stroke-width="3"/>
    <text x="614" y="93" font-size="15" font-weight="bold" fill="#ffffff">Alongside the stack</text>

    <rect x="512" y="102" width="204" height="144" rx="10"
          fill="#f0c060" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="614" y="121" font-size="12.5" font-weight="bold" fill="#000000">performance/</text>
    <rect x="520" y="130" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="145" font-size="10" font-weight="bold" fill="#000000">DoubleVecOps dispatch table</text>
    <rect x="520" y="158" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="173" font-size="10" font-weight="bold" fill="#000000">TranscendentalKernels</text>
    <rect x="520" y="186" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="201" font-size="10" font-weight="bold" fill="#000000">SSE2 &#183; AVX2 &#183; AVX-512 &#183; NEON TUs</text>
    <rect x="520" y="214" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="229" font-size="10" font-weight="bold" fill="#000000">fb_recurrence_policy.h</text>

    <rect x="512" y="254" width="204" height="88" rx="10"
          fill="#f0c060" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="614" y="273" font-size="12.5" font-weight="bold" fill="#000000">io/</text>
    <rect x="520" y="282" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="297" font-size="10" font-weight="bold" fill="#000000">hmm_json.h — JSON, preferred</text>
    <rect x="520" y="310" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="325" font-size="10" font-weight="bold" fill="#000000">legacy XML &#183; FileIOManager</text>

    <rect x="512" y="350" width="204" height="92" rx="10"
          fill="#f0c060" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="614" y="369" font-size="12.5" font-weight="bold" fill="#000000">detail/ &#183; common/</text>
    <rect x="520" y="378" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="393" font-size="10" font-weight="bold" fill="#000000">simd_math_helpers.h</text>
    <rect x="520" y="406" width="188" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="614" y="421" font-size="10" font-weight="bold" fill="#000000">log_utils.h &#183; string_tokenizer</text>

    <!-- Foundation: standard library only -->
    <rect x="12" y="462" width="716" height="52" rx="14"
          fill="#00784f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="370" y="484" font-size="15" font-weight="bold" fill="#ffffff">C++20 standard library only — zero external dependencies</text>
    <text x="370" y="502" font-size="11" fill="#ffffff">GTest fetched via FetchContent for the test suite only &#183; shared (hmm) and static (hmm_static) from one OBJECT target</text>

  </g>
</svg>
