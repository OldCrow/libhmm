# Pre-commit hooks for libhmm.
# Enable locally: python -m pre_commit install
# The `precommit` CI job runs this same config on all files.
#
# Active hooks: file hygiene, #pragma once, clang-format, gersemi.

default_language_version:
  python: python3

repos:
  # ─── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  # ─── C/C++ formatting ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ['--style=file']

  # ─── CMake formatting (settings in .gersemirc) ───────────────────────────────
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi

  # ─── libhmm-specific checks ──────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: check-pragma-once
        name: Verify #pragma once in headers
        entry: python scripts/check-pragma-once.py
        language: python
        files: \.(h|hpp|hxx)$
        pass_filenames: true

# Exclude build artifacts and vendored content
exclude: |
  (?x)^(
    build.*/.*|
    third_party/.*|
    .agents/skills
  )$
